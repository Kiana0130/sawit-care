services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sawitcare
      POSTGRES_USER: sawitcare
      POSTGRES_PASSWORD: sawitcare
    ports:
      - "5432:5432"
    volumes:
      - sawitcare-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sawitcare
      MINIO_ROOT_PASSWORD: sawitcare-minio-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sawitcare-minio:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SCAN_STORAGE_DIR: /app/uploads/scans
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - sawitcare-uploads:/app/uploads/scans

volumes:
  sawitcare-postgres:
  sawitcare-minio:
  sawitcare-uploads:
