services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sawitcare
      POSTGRES_USER: sawitcare
      POSTGRES_PASSWORD: sawitcare
    ports:
      - "5432:5432"
    volumes:
      - sawitcare-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sawitcare
      MINIO_ROOT_PASSWORD: sawitcare-minio-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sawitcare-minio:/data

volumes:
  sawitcare-postgres:
  sawitcare-minio:
